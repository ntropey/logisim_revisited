name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate:
        description: 'Put the temporary password gate on the site (needs the SITE_PASSWORD secret)'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @logisim/app build
      - name: Website tests
        run: pnpm --filter @logisim/website build && pnpm --filter @logisim/website test
        env:
          SITE_URL: https://logisimrevisited.com/
      - run: pnpm --filter @logisim/website build
        env:
          SITE_URL: https://logisimrevisited.com/
          SITE_PASSWORD: ${{ inputs.gate && secrets.SITE_PASSWORD || '' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/website/dist
      - id: deployment
        uses: actions/deploy-pages@v5
