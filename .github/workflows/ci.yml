name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @logisim/app build
      - name: End-to-end tests
        run: |
          pnpm --filter @logisim/app exec playwright install --with-deps chromium
          pnpm --filter @logisim/app e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/app/test-results
          retention-days: 7
      - run: pnpm --filter @logisim/website build
      - run: pnpm --filter @logisim/website test
